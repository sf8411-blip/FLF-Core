name: SMAA tests
on:
  push:
    branches: ["smaa/**"]
  pull_request:
    paths:
      - "smaa/**"
      - "tests/test_smaa.py"
      - "tests/test_smaa_complete.py"
      - "tests/test_smaa_1_1.py"
      - ".github/workflows/smaa-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
